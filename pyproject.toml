[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-literature-rag"
version = "0.1.0"
description = "Agentic arXiv literature review and local-embedding RAG CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arxiv>=2.1,<3",
    "faiss-cpu>=1.8,<2",
    "langchain>=0.3,<2",
    "langchain-community>=0.3,<1",
    "langchain-openai>=0.3,<2",
    "langchain-text-splitters>=0.3,<2",
    "keyring>=25,<26",
    "pypdf>=5,<7",
    "sentence-transformers>=3,<6",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.9,<1",
]

[project.scripts]
literature-rag = "literature_rag.cli:main"

[tool.setuptools.packages.find]
include = ["literature_rag*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
